name: Arsy PostgreSQL RLS

on:
  pull_request:
    paths:
      - ".github/workflows/arsy-postgres-rls.yml"
      - "apps/arsy/**"
      - "packages/database/**"
  push:
    paths:
      - ".github/workflows/arsy-postgres-rls.yml"
      - "apps/arsy/**"
      - "packages/database/**"
  workflow_dispatch:

jobs:
  postgres-rls:
    name: PostgreSQL ${{ matrix.postgres-version }} RLS
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres-version: ["17", "18"]
    services:
      postgres:
        image: postgres:${{ matrix.postgres-version }}
        env:
          POSTGRES_DB: arsy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d arsy_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.0.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Generate isolated database role credentials
        run: |
          migrator_password="$(openssl rand -hex 32)"
          runtime_password="$(openssl rand -hex 32)"
          echo "::add-mask::$migrator_password"
          echo "::add-mask::$runtime_password"
          echo "ARSY_MIGRATOR_PASSWORD=$migrator_password" >> "$GITHUB_ENV"
          echo "ARSY_RUNTIME_PASSWORD=$runtime_password" >> "$GITHUB_ENV"

      - name: Provision PostgreSQL roles through database layer
        run: |
          export ARSY_POSTGRES_ADMIN_URL="postgresql://postgres:postgres@localhost:5432/arsy_test"
          pnpm --filter arsy db:provision-roles

      - name: Verify migrator lock timeout policy
        run: |
          migrator_url="postgresql://arsy_migrator:${ARSY_MIGRATOR_PASSWORD}@localhost:5432/arsy_test"
          actual="$(psql "$migrator_url" -Atqc "SHOW lock_timeout")"
          test "$actual" = "5s"

      - name: Apply migrations as owner
        run: |
          export DATABASE_ADAPTER=postgres
          DATABASE_URL="postgresql://arsy_migrator:${ARSY_MIGRATOR_PASSWORD}@localhost:5432/arsy_test" \
            pnpm --filter arsy db:migrate

      - name: Verify migration rollback and re-apply
        run: |
          export DATABASE_ADAPTER=postgres
          DATABASE_URL="postgresql://arsy_migrator:${ARSY_MIGRATOR_PASSWORD}@localhost:5432/arsy_test" \
            pnpm --filter arsy db:rollback
          DATABASE_URL="postgresql://arsy_migrator:${ARSY_MIGRATOR_PASSWORD}@localhost:5432/arsy_test" \
            pnpm --filter arsy db:migrate

      - name: Grant runtime access to migrated tables
        run: |
          export ARSY_POSTGRES_ADMIN_URL="postgresql://postgres:postgres@localhost:5432/arsy_test"
          pnpm --filter arsy db:provision-roles

      - name: Verify schema, RLS, and least-privilege grants
        env:
          ARSY_POSTGRES_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/arsy_test
        run: |
          psql "$ARSY_POSTGRES_ADMIN_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $
          DECLARE
            invalid_rls integer;
            invalid_indexes integer;
          BEGIN
            SELECT count(*) INTO invalid_rls
            FROM pg_class c
            JOIN pg_namespace n ON n.oid = c.relnamespace
            WHERE n.nspname = 'public'
              AND c.relname IN ('arsy_projects', 'arsy_records', 'arsy_model_definitions',
                                'arsy_model_revisions', 'arsy_model_migration_jobs',
                                'arsy_model_migration_records', 'arsy_model_index_jobs')
              AND (NOT c.relrowsecurity OR NOT c.relforcerowsecurity);
            IF invalid_rls <> 0 THEN
              RAISE EXCEPTION 'RLS is not enabled and forced on % Arsy tables', invalid_rls;
            END IF;

            SELECT count(*) INTO invalid_indexes
            FROM pg_index i
            JOIN pg_class t ON t.oid = i.indrelid
            JOIN pg_namespace n ON n.oid = t.relnamespace
            WHERE n.nspname = 'public' AND t.relname LIKE 'arsy_%' AND NOT i.indisvalid;
            IF invalid_indexes <> 0 THEN
              RAISE EXCEPTION 'Found % invalid Arsy indexes', invalid_indexes;
            END IF;

            IF NOT has_table_privilege('arsy_runtime', 'public.arsy_records', 'SELECT,INSERT,UPDATE,DELETE') THEN
              RAISE EXCEPTION 'Runtime role is missing required record privileges';
            END IF;
            IF has_schema_privilege('arsy_runtime', 'public', 'CREATE') THEN
              RAISE EXCEPTION 'Runtime role must not have CREATE on public schema';
            END IF;
            IF pg_has_role('arsy_runtime', 'arsy_migrator', 'MEMBER') THEN
              RAISE EXCEPTION 'Runtime role must not inherit migrator privileges';
            END IF;
          END $;
          SQL

      - name: Verify lifecycle worker can safely idle as migrator
        run: |
          export DATABASE_ADAPTER=postgres
          DATABASE_URL="postgresql://arsy_migrator:${ARSY_MIGRATOR_PASSWORD}@localhost:5432/arsy_test" \
            pnpm --filter arsy db:lifecycle:work

      - name: Run Arsy tests as runtime role
        run: |
          export DATABASE_ADAPTER=postgres
          export DATABASE_URL="postgresql://arsy_runtime:${ARSY_RUNTIME_PASSWORD}@localhost:5432/arsy_test"
          export ARSY_POSTGRES_TEST_URL="$DATABASE_URL"
          pnpm --filter arsy test
