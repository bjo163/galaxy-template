services:
  arsy-postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arsy}
      POSTGRES_USER: ${POSTGRES_USER:-galaxy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-galaxy-local-dev}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - arsy-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  arsy-postgres-data:
